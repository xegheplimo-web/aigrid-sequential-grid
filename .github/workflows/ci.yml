name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format --check
        run: ruff format --check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    continue-on-error: true   # advisory until the annotations are complete
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: mypy aigrid

  test:
    name: Test (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
        exclude:
          - os: windows-latest
            python: "3.11"
          - os: macos-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: pytest
        run: pytest -q --cov=aigrid --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v5
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  coverage-gate:
    name: Coverage gate
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Enforce minimum coverage
        run: pytest -q --cov=aigrid --cov-report=term --cov-fail-under=40

  integration:
    name: Replay tier (best-effort, geo-dependent)
    runs-on: ubuntu-latest
    needs: test
    # Binance USDT-M endpoints answer HTTP 451 from US-hosted runners, so this job
    # is informational: it never blocks a merge. The hermetic matrix and the
    # coverage gate are the real quality gates.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Probe Binance futures reachability
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://fapi.binance.com/fapi/v1/ping || echo 000)
          echo "fapi.binance.com -> HTTP $code"
          if [ "$code" = "200" ]; then
            echo "REACHABLE=1" >> "$GITHUB_ENV"
          else
            echo "REACHABLE=0" >> "$GITHUB_ENV"
            echo "::warning::fapi.binance.com returned $code (451 = geo-blocked runner); replay tier skipped, hermetic suite stays the gate"
          fi
      - name: Fetch a small slice of public futures candles
        if: env.REACHABLE == '1'
        run: python scripts/fetch_fixtures.py --pairs 3 --candles 1500
      - name: Live-data smoke test (public endpoints, no credentials)
        if: env.REACHABLE == '1'
        env:
          AIGRID_LIVE_DATA: "1"
        run: pytest -q tests/integration
      - name: Replay tier over the downloaded slice
        if: env.REACHABLE == '1'
        env:
          AIGRID_FULL_FIXTURES: "1"
        run: pytest -q

  package:
    name: Build & install wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install the built wheel in a clean venv
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/python -c "import aigrid, sys; print('aigrid', aigrid.__version__)"
          /tmp/venv/bin/aigrid-preflight --help
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  security:
    name: Security (bandit + secret scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: bandit
        run: bandit -r aigrid -c pyproject.toml -f sarif -o bandit.sarif || true
      - name: Upload bandit SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit.sarif
      - name: gitleaks (committed secrets)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: pip-audit (dependency CVEs)
        run: |
          python -m pip install pip-audit
          pip-audit --strict --desc || true
